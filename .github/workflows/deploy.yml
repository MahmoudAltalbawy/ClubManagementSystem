name: Deploy

on:
  push:
    branches: [main]

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # JOB 1 — Deploy to Core Machine
  # ─────────────────────────────────────────────────────────────────────────────
  deploy-core:
    name: Deploy → Core Machine
    runs-on: ubuntu-latest

    steps:
      - name: SSH → Pull latest code & rebuild
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.CORE_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.CORE_SSH_PRIVATE_KEY }}
          script: |
            cd ~/ClubManagementSystem
            git pull origin main
            docker compose -f core_machine/docker-compose.yml up -d --build --remove-orphans
            docker image prune -f

  # ─────────────────────────────────────────────────────────────────────────────
  # JOB 2 — Deploy to AI Machine (runs in PARALLEL with Job 1)
  # ─────────────────────────────────────────────────────────────────────────────
  deploy-ai:
    name: Deploy → AI Machine
    runs-on: ubuntu-latest

    steps:
      - name: SSH → Pull latest code & rebuild
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.AI_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.AI_SSH_PRIVATE_KEY }}
          script: |
            cd ~/ClubManagementSystem
            git pull origin main
            docker compose -f ai_machine/docker-compose.yml up -d --build --remove-orphans
            docker image prune -f
