name: Build & Deploy

on:
  push:
    branches: [main]

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # JOB 1 — Build all images and push to GHCR (using automatic GITHUB_TOKEN)
  # ─────────────────────────────────────────────────────────────────────────────
  build:
    name: Build & Push Images
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push dotnet_backend
        uses: docker/build-push-action@v5
        with:
          context: ./core_machine/dotnet_backend
          push: true
          tags: ghcr.io/mahmoudaltalbawy/equipex-dotnet-backend:latest

      - name: Build & Push stats_extractor
        uses: docker/build-push-action@v5
        with:
          context: ./core_machine/stats_extractor
          push: true
          tags: ghcr.io/mahmoudaltalbawy/equipex-stats-extractor:latest

      - name: Build & Push prediction_model
        uses: docker/build-push-action@v5
        with:
          context: ./ai_machine/prediction_model
          push: true
          tags: ghcr.io/mahmoudaltalbawy/equipex-prediction-model:latest

      - name: Build & Push chatbot_service
        uses: docker/build-push-action@v5
        with:
          context: ./ai_machine/chatbot_service
          push: true
          tags: ghcr.io/mahmoudaltalbawy/equipex-chatbot-service:latest

  # ─────────────────────────────────────────────────────────────────────────────
  # JOB 2 — Deploy to Core Machine (parallel with Job 3)
  # ─────────────────────────────────────────────────────────────────────────────
  deploy-core:
    name: Deploy → Core Machine
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Copy compose file to Core Machine
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.CORE_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.CORE_SSH_PRIVATE_KEY }}
          source: core_machine/docker-compose.prod.yml
          target: ~/
          strip_components: 1

      - name: Copy database schema dump to Core Machine
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.CORE_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.CORE_SSH_PRIVATE_KEY }}
          source: almost_done
          target: ~/

      - name: Deploy & Auto-migrate Core Machine
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.CORE_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.CORE_SSH_PRIVATE_KEY }}
          envs: GHCR_TOKEN,GHCR_USER
          script: |
            echo $GHCR_TOKEN | docker login ghcr.io -u $GHCR_USER --password-stdin
            docker pull ghcr.io/mahmoudaltalbawy/equipex-dotnet-backend:latest
            docker pull ghcr.io/mahmoudaltalbawy/equipex-stats-extractor:latest
            docker compose -f ~/docker-compose.prod.yml up -d --remove-orphans

            # Wait for Postgres to be ready
            sleep 4
            docker exec equipex_postgres psql -U postgres -d equ -c "CREATE EXTENSION IF NOT EXISTS citext;" || true

            # Check if users table exists; if not, automatically load schema and restart backend
            if ! docker exec -i equipex_postgres psql -U postgres -d equ -c "SELECT to_regclass('public.users');" | grep -q "users"; then
              echo "Database tables missing. Initializing database schema from almost_done..."
              docker exec -i equipex_postgres psql -U postgres -d equ < ~/almost_done
              docker restart equipex_dotnet_backend
              echo "Database schema initialized successfully!"
            else
              echo "Database schema is already up to date."
            fi

            docker image prune -f
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}

  # ─────────────────────────────────────────────────────────────────────────────
  # JOB 3 — Deploy to AI Machine (parallel with Job 2)
  # ─────────────────────────────────────────────────────────────────────────────
  deploy-ai:
    name: Deploy → AI Machine
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Copy compose file to AI Machine
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.AI_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.AI_SSH_PRIVATE_KEY }}
          source: ai_machine/docker-compose.prod.yml
          target: ~/
          strip_components: 1

      - name: Deploy to AI Machine
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.AI_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.AI_SSH_PRIVATE_KEY }}
          envs: GHCR_TOKEN,GHCR_USER,GROQ_KEY
          script: |
            echo $GHCR_TOKEN | docker login ghcr.io -u $GHCR_USER --password-stdin
            echo "GROQ_API_KEY=$GROQ_KEY" > ~/.env
            docker pull ghcr.io/mahmoudaltalbawy/equipex-prediction-model:latest
            docker pull ghcr.io/mahmoudaltalbawy/equipex-chatbot-service:latest
            docker compose --env-file ~/.env -f ~/docker-compose.prod.yml up -d --remove-orphans
            docker image prune -f
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
          GROQ_KEY: ${{ secrets.GROQ_API_KEY }}
