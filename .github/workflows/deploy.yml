name: Build, Push & Deploy

on:
  push:
    branches: [main]

env:
  REGISTRY: ghcr.io
  OWNER: mahmoudaltalbawy  # Must be lowercase

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # JOB 1 — Build all Docker images and push them to GitHub Container Registry
  # ─────────────────────────────────────────────────────────────────────────────
  build-and-push:
    name: Build & Push Images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ── Core Machine Images ──────────────────────────────────────────────────

      - name: Build & Push dotnet_backend
        uses: docker/build-push-action@v5
        with:
          context: ./core_machine/dotnet_backend
          push: true
          tags: ghcr.io/${{ env.OWNER }}/equipex-dotnet-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & Push stats_extractor
        uses: docker/build-push-action@v5
        with:
          context: ./core_machine/stats_extractor
          push: true
          tags: ghcr.io/${{ env.OWNER }}/equipex-stats-extractor:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ── AI Machine Images ────────────────────────────────────────────────────

      - name: Build & Push prediction_model
        uses: docker/build-push-action@v5
        with:
          context: ./ai_machine/prediction_model
          push: true
          tags: ghcr.io/${{ env.OWNER }}/equipex-prediction-model:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & Push chatbot_service
        uses: docker/build-push-action@v5
        with:
          context: ./ai_machine/chatbot_service
          push: true
          tags: ghcr.io/${{ env.OWNER }}/equipex-chatbot-service:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─────────────────────────────────────────────────────────────────────────────
  # JOB 2 — Deploy to Core Machine (runs in PARALLEL with Job 3)
  # ─────────────────────────────────────────────────────────────────────────────
  deploy-core:
    name: Deploy → Core Machine
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Copy docker-compose.prod.yml to Core Machine
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.CORE_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.CORE_SSH_PRIVATE_KEY }}
          source: core_machine/docker-compose.prod.yml
          target: ~/
          strip_components: 1

      - name: SSH → Pull images & restart services
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.CORE_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.CORE_SSH_PRIVATE_KEY }}
          script: |
            # Log in to GHCR so we can pull private images
            echo "${{ secrets.CR_PAT }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            # Pull latest images
            docker-compose -f ~/docker-compose.prod.yml pull

            # Restart with zero-downtime (starts new containers, stops old ones)
            docker-compose -f ~/docker-compose.prod.yml up -d --remove-orphans

            # Clean up old dangling images to save disk space
            docker image prune -f

  # ─────────────────────────────────────────────────────────────────────────────
  # JOB 3 — Deploy to AI Machine (runs in PARALLEL with Job 2)
  # ─────────────────────────────────────────────────────────────────────────────
  deploy-ai:
    name: Deploy → AI Machine
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Copy docker-compose.prod.yml to AI Machine
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.AI_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.AI_SSH_PRIVATE_KEY }}
          source: ai_machine/docker-compose.prod.yml
          target: ~/
          strip_components: 1

      - name: SSH → Pull images & restart services
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.AI_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.AI_SSH_PRIVATE_KEY }}
          script: |
            # Log in to GHCR so we can pull private images
            echo "${{ secrets.CR_PAT }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            # Pull latest images
            docker-compose -f ~/docker-compose.prod.yml pull

            # Restart with zero-downtime
            docker-compose -f ~/docker-compose.prod.yml up -d --remove-orphans

            # Clean up old dangling images to save disk space
            docker image prune -f

